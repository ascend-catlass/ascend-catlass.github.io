name: Deploy Python package index

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test index generator
        run: python3 -m unittest discover -s tests -v

  # Upload in its own job so the artifact is finalized and indexed before the
  # deploy job queries it. Running upload and deploy in the same job raced: the
  # artifact was only queryable seconds after deploy-pages looked for it.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build PEP 503 index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_index.py --output _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      # deploy-pages fails with "Found 0 artifact(s)" when the artifact has not
      # been indexed yet. Poll the same view it uses until github-pages exists.
      - name: Wait until the Pages artifact is queryable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
                 --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "github-pages artifact is visible (attempt ${attempt})."
              exit 0
            fi
            echo "waiting for the github-pages artifact (attempt ${attempt}/40)..."
            sleep 5
          done
          echo "::error::The github-pages artifact never became visible; cannot deploy." >&2
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
